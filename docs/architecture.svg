<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="구조 — 확장자 레지스트리와 지연 로딩, 워커와 Rust 백그라운드, 번들 크기">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15111D"/><stop offset="1" stop-color="#110E18"/></linearGradient>
    <linearGradient id="a-key" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B1A78"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <marker id="a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker>
    <style>
      .t { font-family: Segoe UI, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; }
      .m { font-family: 'Cascadia Mono', Consolas, 'SF Mono', monospace; }
      .box { fill: #1C1628; stroke: #352B4B; }
      .lane { fill: #17121F; stroke: #4C3A78; stroke-dasharray: 5 4; }
      .k { font-size: 11px; font-weight: 700; fill: #8F84A8; letter-spacing: 1px; }
      .h { font-size: 15px; font-weight: 700; fill: #F1EEF7; }
      .d { font-size: 12px; fill: #A79DBE; }
      .lh { font-size: 13.5px; font-weight: 700; fill: #C4B5FD; }
    </style>
  </defs>
  <rect width="920" height="470" rx="18" fill="url(#a-bg)"/>
  <rect x="0.5" y="0.5" width="919" height="469" rx="17.5" fill="none" stroke="#2C2440"/>

  <!-- 흐름 -->
  <g class="t">
    <rect class="box" x="20" y="20" width="250" height="92" rx="12"/>
    <text class="k" x="36" y="44">입력</text>
    <text class="h" x="36" y="68">더블클릭 · 드롭 · Ctrl+O</text>
    <text class="d" x="36" y="90">이미 떠 있으면 같은 프로세스에 새 창</text>

    <rect x="320" y="20" width="270" height="92" rx="12" fill="url(#a-key)"/>
    <text class="k" x="336" y="44" fill="#DDD6FE">진입 청크 · 38 kB</text>
    <text class="h" x="336" y="68">확장자 → 뷰어 레지스트리</text>
    <text class="d" x="336" y="90" fill="#EDE9FE">제목줄 · 테마 · 업데이트 잠금만</text>

    <rect class="box" x="640" y="20" width="260" height="92" rx="12"/>
    <text class="k" x="656" y="44">LAZY IMPORT</text>
    <text class="h" x="656" y="68">그 형식의 뷰어만</text>
    <text class="d" x="656" y="90">Mermaid · KaTeX도 블록이 있을 때만</text>
  </g>
  <line x1="274" y1="66" x2="314" y2="66" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#a-arr)"/>
  <line x1="594" y1="66" x2="634" y2="66" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#a-arr)"/>

  <!-- 실행 위치 -->
  <g class="t">
    <rect class="lane" x="20" y="130" width="280" height="96" rx="12"/>
    <text class="lh" x="36" y="156">Web Worker (3D)</text>
    <text class="d" x="36" y="180">파싱 · occt wasm · 엣지 · BVH</text>
    <text class="d" x="36" y="200">glTF · meshopt 압축 · 큰 업로드는 청크로</text>

    <rect class="lane" x="320" y="130" width="280" height="96" rx="12"/>
    <text class="lh" x="336" y="156">Rust 백그라운드</text>
    <text class="d" x="336" y="180">점군 파싱 · 필터 · 선택 · 저장 · ICP</text>
    <text class="d" x="336" y="200">CP949 변환 · 이미지 클립보드</text>

    <rect class="lane" x="620" y="130" width="280" height="96" rx="12"/>
    <text class="lh" x="636" y="156">공용 3D 코어 (Tauri 없음)</text>
    <text class="d" x="636" y="180">앱 뷰어와 HTML 내보내기 런타임이</text>
    <text class="d" x="636" y="200">같은 코드를 쓴다</text>
  </g>

  <!-- 번들 크기(로그 눈금, v0.11.0 npm run build, 압축 전) -->
  <g class="t">
    <text class="h" x="20" y="268">처음 싣는 것 vs 필요할 때만</text>
    <text class="d" x="900" y="268" text-anchor="end">v0.11.0 npm run build · 압축 전 · 로그 눈금</text>
    <g font-size="13">
      <text x="20" y="300" fill="#C4B5FD" font-weight="700">진입 청크 (시작 시)</text>
      <rect x="230" y="289" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="289" width="113" height="14" rx="4" fill="#8B5CF6"/>
      <text x="900" y="300" text-anchor="end" fill="#F1EEF7" font-weight="700">38 kB</text>

      <text x="20" y="326" fill="#A79DBE">three.js 코어</text>
      <rect x="230" y="315" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="315" width="264" height="14" rx="4" fill="#5B4A86"/>
      <text x="900" y="326" text-anchor="end" fill="#A79DBE">232 kB</text>

      <text x="20" y="352" fill="#A79DBE">HTML 내보내기</text>
      <rect x="230" y="341" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="341" width="386" height="14" rx="4" fill="#5B4A86"/>
      <text x="900" y="352" text-anchor="end" fill="#A79DBE">983 kB</text>

      <text x="20" y="378" fill="#A79DBE">PDF.js 워커</text>
      <rect x="230" y="367" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="367" width="413" height="14" rx="4" fill="#5B4A86"/>
      <text x="900" y="378" text-anchor="end" fill="#A79DBE">1.4 MB</text>

      <text x="20" y="404" fill="#A79DBE">Mermaid 레이아웃(elk)</text>
      <rect x="230" y="393" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="393" width="418" height="14" rx="4" fill="#5B4A86"/>
      <text x="900" y="404" text-anchor="end" fill="#A79DBE">1.5 MB</text>

      <text x="20" y="430" fill="#A79DBE">occt wasm (STEP/IGES)</text>
      <rect x="230" y="419" width="580" height="14" rx="4" fill="#241C33"/><rect x="230" y="419" width="557" height="14" rx="4" fill="#5B4A86"/>
      <text x="900" y="430" text-anchor="end" fill="#A79DBE">7.6 MB</text>
    </g>
    <text class="d" x="20" y="456">md 한 장을 열 때 싣는 코드는 38 kB — 3D · PDF · 다이어그램 엔진은 그 형식을 열 때 처음 불러온다.</text>
  </g>
</svg>
